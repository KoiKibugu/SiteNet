# The webroot is the git repository working tree — never expose repo internals.
RedirectMatch 404 /\.git

<Directory /var/www/html/docker>
    Require all denied
</Directory>

<Directory /var/www/html/Docs>
    Require all denied
</Directory>

<FilesMatch "\.(sql|sql\.gz|log|md|sh|yml|yaml|conf|json|lock)$">
    Require all denied
</FilesMatch>